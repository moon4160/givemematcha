name: Restock Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 0-8 * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run checker
        env:
          TARGET_URL: https://www.marukyu-koyamaen.co.jp/english/shop/products/catalog/matcha
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_matcha.py

      - name: Commit updated snapshot if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_hash.txt state/last_snapshot.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update matcha snapshot"
            git push
          fi
